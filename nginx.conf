server {
  listen 80;
  server_name zular.net www.zular.net _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml model/gltf-binary;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  types {
    text/html html;
    text/css css;
    application/javascript js;
    image/svg+xml svg;
    image/png png;
    font/woff woff;
    model/gltf-binary glb;
    application/zip zip;
    image/jpeg jpg;
    text/plain txt;
    application/xml xml;
    application/manifest+json webmanifest;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite names these files by content, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # These keep their names between releases.
  location ~* \.(?:svg|png|jpg|woff|glb|zip)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
