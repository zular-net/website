# Temporary: formats the branch and tries the real build in a browser, then gets removed.
name: Format and smoke test
on:
  push:
    branches: [seo]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: format"
          git push
      - run: npm run build
      - run: head -c 900 dist/index.html; cat dist/sitemap.xml
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node .github/tmp/smoke.cjs
