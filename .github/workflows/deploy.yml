name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    # GitHub's free plan only serves Pages from public repositories.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  check-live:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check the published site
        run: |
          pubkey=7b5c24dcd480cf1b33653ffc06b4e9e4c129314c96cc038abedf10115df89351
          for attempt in 1 2 3 4 5 6 7 8; do
            headers=$(curl -fsSI https://zular.net/.well-known/nostr.json || true)
            body=$(curl -fsS https://zular.net/.well-known/nostr.json || true)
            if echo "$body" | grep -q "$pubkey" && echo "$headers" | grep -qi '^access-control-allow-origin: \*'; then
              echo "NIP-05 is live"
              curl -fsS https://zular.net/robots.txt
              curl -fsS https://zular.net/ | grep -o 'property="og:image" content="[^"]*"'
              exit 0
            fi
            sleep 30
          done
          echo "NIP-05 check failed"
          echo "$headers"
          exit 1
