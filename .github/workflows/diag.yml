name: Diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          dig +short zular.net A; dig +short www.zular.net CNAME; dig +short zular.net AAAA; dig +short zular.net CAA
          echo | openssl s_client -connect zular.net:443 -servername zular.net 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          curl -sSI http://zular.net/ | head -8 || true
          curl -sSI http://zular.net/.well-known/nostr.json | head -12 || true
          curl -sS http://zular.net/.well-known/nostr.json | head -5 || true
          curl -sSkI https://zular.net/ | head -6 || true
          curl -sS http://zular.net/ | grep -o 'property="og:image" content="[^"]*"' || true
